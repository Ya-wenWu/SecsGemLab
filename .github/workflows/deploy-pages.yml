name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/SecsGemLab.Web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Blazor WASM
        run: dotnet publish src/SecsGemLab.Web/SecsGemLab.Web.csproj -c Release
      - uses: actions/configure-pages@v5
        with:
          static_site_generator: dotnet
      - uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
