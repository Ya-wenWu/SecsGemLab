name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (git history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Dependency audit (direct packages, blocking)
        run: |
          dotnet restore
          dotnet list package --vulnerable 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "Vulnerable direct packages detected"
            exit 1
          fi
          echo "No known vulnerabilities in direct packages"

      # Transitive packages are reported but do not fail the build yet:
      # Dependabot already tracks them (System.Net.Http 4.3.x, System.Text.RegularExpressions 4.3.0,
      # Microsoft.NETCore.App.Runtime.Mono.browser-wasm 8.0.x). Make this blocking once they are fixed.
      - name: Dependency audit (transitive, informational)
        continue-on-error: true
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit-transitive.log
          ! grep -q "has the following vulnerable packages" audit-transitive.log

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
      - run: dotnet restore

      - name: Lint & Format check
        run: dotnet format whitespace --folder --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
